<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Snake — Hector</title>
  <style>
    :root { color-scheme: dark; --bg: #0b1020; --panel: #121a2d; --line: #27334c; --text: #edf2ff; --muted: #9aa8c3; --green: #54e6a5; --blue: #79a8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #172644, var(--bg) 62%); color: var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
    main { width: min(100%, 520px); padding: clamp(20px, 5vw, 32px); border: 1px solid var(--line); border-radius: 24px; background: color-mix(in srgb, var(--panel) 94%, transparent); box-shadow: 0 24px 80px #0006; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); letter-spacing: -.04em; }
    p { margin: 5px 0 0; color: var(--muted); }
    .score { text-align: right; color: var(--muted); font-size: .82rem; }
    .score strong { display: block; color: var(--green); font-size: 1.5rem; }
    .board-wrap { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #080d18; aspect-ratio: 1; }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: #080d18cc; }
    .overlay[hidden] { display: none; }
    .overlay-card { max-width: 290px; }
    .overlay h2 { margin: 0 0 8px; }
    .overlay p { margin: 0 0 18px; }
    button { border: 1px solid #3c526f; border-radius: 12px; padding: 11px 16px; background: #1b2b45; color: var(--text); font: inherit; font-weight: 650; cursor: pointer; touch-action: manipulation; }
    button:hover { border-color: var(--blue); background: #24395a; }
    .start { background: #146b50; border-color: #278b6a; }
    .start:hover { background: #197d5e; }
    .help { margin: 14px 0 18px; text-align: center; font-size: .88rem; }
    .controls { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 48px); justify-content: center; gap: 7px; }
    .controls button { padding: 4px; font-size: 1.15rem; }
    .controls [data-dir="up"] { grid-column: 2; }
    .controls [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .controls [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .controls [data-dir="right"] { grid-column: 3; grid-row: 2; }
    footer { margin-top: 20px; text-align: center; color: var(--muted); font-size: .85rem; }
    footer a { color: var(--blue); text-decoration: none; }
    @media (max-width: 380px) { body { padding: 12px; } main { padding: 18px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>🐍 Snake</h1><p>Uma pausa rápida, direto no navegador.</p></div>
      <div class="score">PONTOS<strong id="score">0</strong></div>
    </header>
    <div class="board-wrap">
      <canvas id="board" width="400" height="400" aria-label="Tabuleiro do jogo da cobrinha"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="message-title">Pronto para jogar?</h2>
          <p id="message-text">Pegue as maçãs e tente bater seu recorde.</p>
          <button class="start" id="start">Começar · Espaço</button>
        </div>
      </div>
    </div>
    <p class="help">Use <strong>↑ ↓ ← →</strong> ou <strong>W A S D</strong>. No celular, toque nos controles.</p>
    <div class="controls" aria-label="Controles do jogo">
      <button data-dir="up" aria-label="Cima">▲</button>
      <button data-dir="left" aria-label="Esquerda">◀</button>
      <button data-dir="down" aria-label="Baixo">▼</button>
      <button data-dir="right" aria-label="Direita">▶</button>
    </div>
    <footer><a href="https://github.com/hectornetf">← Voltar ao perfil de Hector</a></footer>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#board');
      const ctx = canvas.getContext('2d');
      const overlay = document.querySelector('#overlay');
      const scoreEl = document.querySelector('#score');
      const titleEl = document.querySelector('#message-title');
      const textEl = document.querySelector('#message-text');
      const cell = 20;
      const count = canvas.width / cell;
      let snake, food, direction, nextDirection, score, timer, playing = false;

      function placeFood() {
        do { food = { x: Math.floor(Math.random() * count), y: Math.floor(Math.random() * count) }; }
        while (snake.some(part => part.x === food.x && part.y === food.y));
      }
      function draw() {
        ctx.fillStyle = '#080d18'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#ffffff08'; ctx.lineWidth = 1;
        for (let i = 1; i < count; i++) {
          ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
        }
        ctx.fillStyle = '#ff7185'; ctx.beginPath();
        ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * .38, 0, Math.PI * 2); ctx.fill();
        snake.forEach((part, i) => {
          ctx.fillStyle = i === 0 ? '#a4ffd5' : '#54e6a5';
          ctx.beginPath(); ctx.roundRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4, 6); ctx.fill();
        });
      }
      function reset() {
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        direction = { x: 1, y: 0 }; nextDirection = direction; score = 0;
        scoreEl.textContent = score; placeFood(); draw();
      }
      function endGame() {
        playing = false; clearInterval(timer);
        titleEl.textContent = 'Fim de jogo!';
        textEl.textContent = `Você fez ${score} ponto${score === 1 ? '' : 's'}. Quer tentar de novo?`;
        document.querySelector('#start').textContent = 'Jogar de novo · Espaço';
        overlay.hidden = false;
      }
      function step() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const eating = head.x === food.x && head.y === food.y;
        if (head.x < 0 || head.x >= count || head.y < 0 || head.y >= count || snake.slice(0, eating ? undefined : -1).some(part => part.x === head.x && part.y === head.y)) return endGame();
        snake.unshift(head);
        if (eating) { score++; scoreEl.textContent = score; placeFood(); }
        else snake.pop();
        draw();
      }
      function start() {
        if (playing) return;
        reset(); playing = true; overlay.hidden = true;
        timer = setInterval(step, 115);
      }
      function turn(dir) {
        const moves = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
        const move = moves[dir];
        if (move && (move.x !== -direction.x || move.y !== -direction.y)) nextDirection = move;
      }
      const keys = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
      document.addEventListener('keydown', event => {
        if (keys[event.key]) { event.preventDefault(); if (!playing) start(); turn(keys[event.key]); }
        if (event.code === 'Space') { event.preventDefault(); start(); }
      });
      document.querySelector('#start').addEventListener('click', start);
      document.querySelectorAll('[data-dir]').forEach(button => button.addEventListener('click', () => { if (!playing) start(); turn(button.dataset.dir); }));
      reset();
    })();
  </script>
</body>
</html>
